b.onclick=()=>{s.dataset.mode=s.dataset.mode==='menti'?'':'menti';sync()};s.dataset.q=qid;s.dataset.cloud=id==='perusahaan'?'1':'';document.querySelector('main').appendChild(s);setTimeout(sync)});
const seen={};
async function refresh(id){const s=$('p-'+id);if(!s||!s.dataset.q||s.dataset.mode==='menti')return;const st=s.querySelector('.st'),c=s.querySelector('.chips');
try{const r=await fetch('/api/menti?q='+s.dataset.q,{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);
const v=d.results||[],sig=JSON.stringify(v);const tot=v.reduce((n,x)=>n+(x.count||1),0);
st.textContent=tot+' jawaban'+(d.participants!=null?' · '+d.participants+' peserta':'')+' · live dari Menti';
if(seen[id]===sig)return;const old=new Set(seen[id]?JSON.parse(seen[id]).map(x=>x.text):[]);seen[id]=sig;c.innerHTML='';
if(!v.length){const e=document.createElement('p');e.className='empty';e.textContent='Belum ada jawaban.';c.appendChild(e);return}
const list=s.dataset.cloud?[...v].sort((a,b)=>b.count-a.count):v;const mx=Math.max(...v.map(x=>x.count||1));
list.forEach(x=>{const e=document.createElement('span');e.className='chip';e.textContent=x.text;if(old.has(x.text))e.style.animation='none';
if(x.count>1){const k=document.createElement('b');k.textContent='×'+x.count;e.appendChild(k)}
if(s.dataset.cloud)e.style.fontSize='calc(clamp(1rem,1.6vw,1.35rem) * '+(1+0.9*((x.count||1)-1)/Math.max(mx-1,1)).toFixed(2)+')';c.appendChild(e)})}
catch(e){st.textContent=location.protocol==='file:'?'Jawaban baru tampil di link Vercel. Kalau file dibuka langsung dari laptop, pakai "Tampilan slide Menti".':'Belum bisa membaca jawaban dari Menti. Klik "Tampilan slide Menti" sebagai cadangan.'}}
setInterval(()=>{const h=(location.hash||'#agenda').slice(1);if(R.some(r=>r[1]===h)&&!document.hidden)refresh(h)},5000);
function loadFrame(id){if(R.some(r=>r[1]===id))refresh(id)}
function route(){const h=(location.hash||'#agenda').slice(1),id=PAGES.some(p=>p[0]===h)?h:'agenda';
document.querySelectorAll('.pg').forEach(s=>s.classList.toggle('on',s.id==='p-'+id));loadFrame(id);
[...tabs.children].forEach(a=>a.toggleAttribute('aria-current',a.dataset.id===id)||0);[...tabs.children].forEach(a=>{if(a.dataset.id===id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}
addEventListener('hashchange',route);route();
let cur=0,left=0,tick=null;const parts=$('parts');
P.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.n+' · '+p.m+' mnt';b.onclick=()=>show(i);parts.appendChild(b)});
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function stp(){clearInterval(tick);tick=null;$('go').textContent='Mulai'}
function show(i){cur=i;const p=P[i];stp();left=p.m*60;$('clock').textContent=fmt(left);[...parts.children].forEach((b,k)=>b.setAttribute('aria-current',k===i));
$('where').textContent='Bagian '+(i+1)+' dari '+P.length;$('title').textContent=p.t;$('lead').textContent=p.l;
$('list').innerHTML='';(p.li||[]).forEach(x=>{const li=document.createElement('li');li.textContent=x;$('list').appendChild(li)});$('list').hidden=!p.li;$('out').textContent=p.o||'';$('out').hidden=!p.o}
let actx=null;function ensureAudio(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function alarm(){ensureAudio();if(!actx)return;const t0=actx.currentTime+.05;
for(let k=0;k<3;k++)for(let i=0;i<4;i++){const o=actx.createOscillator(),g=actx.createGain(),st=t0+k*1.1+i*.16;o.type='square';o.frequency.value=i%2?1175:880;
g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.22,st+.01);g.gain.exponentialRampToValueAtTime(.001,st+.14);o.connect(g);g.connect(actx.destination);o.start(st);o.stop(st+.15)}}
$('tes').onclick=alarm;
$('go').onclick=()=>{ensureAudio();if(tick){stp();return}$('go').textContent='Jeda';tick=setInterval(()=>{left--;$('clock').textContent=fmt(Math.max(left,0));if(left<=0){stp();alarm();for(let k=0;k<8;k++)setTimeout(popRandom,k*120)}},1000)};
$('reset').onclick=()=>show(cur);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||!$('p-agenda').classList.contains('on'))return;if(e.key==='ArrowRight')show(Math.min(cur+1,P.length-1));if(e.key==='ArrowLeft')show(Math.max(cur-1,0))});
function drawQR(){let r=$('code').value.trim();if(r.includes('/'))r=r.split('/').filter(Boolean).pop();const c=r.replace(/[^a-z0-9]/gi,''),q=$('qr'),a=$('qrcap');q.innerHTML='';q.hidden=!c;if(!c){a.textContent='';return}
const u='https://www.menti.com/'+c;a.href=u;a.textContent='menti.com/'+c;try{new QRCode(q,{text:u,width:400,height:400,correctLevel:QRCode.CorrectLevel.M})}catch(e){q.hidden=true}}
$('code').oninput=drawQR;

const sky=$('sky');
function pop(b){if(b.classList.contains('pop'))return;b.classList.add('pop');setTimeout(()=>{b.remove();spawn()},350)}
function spawn(){const b=document.createElement('div');b.className='bub';const s=28+Math.random()*90;b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*96}%;top:${100+Math.random()*20}vh;animation-duration:${22+Math.random()*26}s;animation-delay:-${Math.random()*20}s`;b.onclick=()=>pop(b);sky.appendChild(b)}
function popRandom(){const a=sky.querySelectorAll('.bub:not(.pop)');if(a.length)pop(a[Math.floor(Math.random()*a.length)])}
for(let i=0;i<16;i++)spawn();show(0);drawQR();
</script></body></html>
